name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cloudops_test
          POSTGRES_PASSWORD: cloudops_local_test
          POSTGRES_DB: cloudops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloudops_test -d cloudops_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: PostgreSQL workspace isolation
        run: npm run test:postgres
        env:
          CLOUDOPS_TEST_DATABASE_URL: postgresql://cloudops_test:cloudops_local_test@127.0.0.1:5432/cloudops_test

      - name: Validate finding contract
        run: npm run contracts:validate

      - name: Check whitespace
        run: git diff --check
